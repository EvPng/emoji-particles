<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emoji Particles</title>
    <meta
      name="description"
      content="Type an emoji and it becomes a field of particles you can push around."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%91%8B</text></svg>"
    />
  </head>
  <body>
    <main>
      <header>
        <h1>Emoji Particles</h1>
        <p>Turn an emoji into particles and play with it.</p>
      </header>

      <div id="stage">
        <canvas id="canvas"></canvas>
        <p id="empty" hidden>That one has nothing to draw. Try another.</p>
      </div>

      <div class="controls">
        <input
          id="input"
          type="text"
          value="👋"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          aria-label="Emoji to render"
        />
        <button id="shuffle" type="button">Shuffle</button>

        <div class="modes" role="radiogroup" aria-label="Cursor force">
          <button
            type="button"
            class="mode"
            data-mode="push"
            role="radio"
            aria-checked="false"
            tabindex="-1"
          >
            Push
          </button>
          <button
            type="button"
            class="mode"
            data-mode="pull"
            role="radio"
            aria-checked="true"
            tabindex="0"
          >
            Pull
          </button>
        </div>
      </div>

      <p class="count"><span id="count">0</span> particles</p>
    </main>

    <footer>
      <a href="https://github.com/EvPng/emoji-particles" target="_blank" rel="noopener">
        Github
      </a>
      <span aria-hidden="true">·</span>
      <a href="https://www.evpeng.com" target="_blank" rel="noopener">Author</a>
    </footer>

    <script type="module" src="main.js"></script>
  </body>
</html>
